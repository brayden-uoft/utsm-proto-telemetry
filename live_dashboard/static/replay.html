<!doctype html><html lang="en" data-mode="simple"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run Replay | UTSM</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css?v=4"></head>
<body data-page="runs"><main>
  <section class="page-head"><div><p class="eyebrow">Past run</p><h1 id="title">Loading replay…</h1><p class="lede">Move through the recorded route and inspect the synchronized telemetry sample.</p></div><a id="backLink" class="button secondary" href="/runs">Back to run</a></section>
  <div id="message" role="status" aria-live="polite"></div>
  <section id="player" hidden><div class="grid grid-4"><article class="card metric"><div class="metric-label">Progress</div><div class="metric-value"><span id="progress">0</span><span class="metric-unit">%</span></div></article><article class="card metric"><div class="metric-label">Speed</div><div class="metric-value"><span id="speed">—</span><span class="metric-unit"> km/h</span></div></article><article class="card metric"><div class="metric-label">Current</div><div class="metric-value"><span id="current">—</span><span class="metric-unit"> A</span></div></article><article class="card metric"><div class="metric-label">Temperature</div><div class="metric-value"><span id="temperature">—</span><span class="metric-unit"> °C</span></div></article></div>
    <section class="card section"><div class="toolbar"><button id="play" class="button" type="button">Play replay</button><div class="field grow"><label for="position">Replay position</label><input id="position" type="range" min="0" max="0" value="0"></div></div><canvas id="map" class="map section" aria-label="Animated run route" aria-describedby="replaySummary"></canvas><p id="replaySummary" class="visual-summary"></p></section>
  </section>
</main><script src="/static/shell.js?v=2"></script><script>
  const byId=id=>document.getElementById(id),runId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()),fmt=(value,digits=1)=>value==null?'—':Number(value).toFixed(digits);let samples=[],index=0,playing=false,frame=0,lastFrame=0;
  function render(){if(!samples.length)return;const sample=samples[index],progress=sample.route_progress_percent??(samples.length===1?100:index/(samples.length-1)*100);byId('progress').textContent=progress.toFixed(0);byId('speed').textContent=fmt(sample.speed_kph);byId('current').textContent=fmt(sample.current_A,2);byId('temperature').textContent=fmt(sample.temperature_C);byId('position').value=String(index);draw();byId('replaySummary').textContent=`Sample ${index+1} of ${samples.length}. Route progress ${progress.toFixed(0)} percent. Telemetry timestamp ${fmt(sample.timestamp_ms,0)} ms. Speed ${fmt(sample.speed_kph)} km/h, current ${fmt(sample.current_A,2)} A, temperature ${fmt(sample.temperature_C)} °C.`}
  function draw(){const canvas=byId('map'),ratio=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*ratio;canvas.height=h*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle='#091522';ctx.fillRect(0,0,w,h);let minLat=Infinity,maxLat=-Infinity,minLon=Infinity,maxLon=-Infinity;samples.forEach(s=>{minLat=Math.min(minLat,s.lat);maxLat=Math.max(maxLat,s.lat);minLon=Math.min(minLon,s.lon);maxLon=Math.max(maxLon,s.lon)});const pad=30,scale=Math.min((w-pad*2)/Math.max(maxLon-minLon,1e-9),(h-pad*2)/Math.max(maxLat-minLat,1e-9)),point=s=>[w/2+(s.lon-(minLon+maxLon)/2)*scale,h/2-(s.lat-(minLat+maxLat)/2)*scale];ctx.strokeStyle='#29405b';ctx.lineWidth=3;ctx.beginPath();samples.forEach((sample,i)=>{const [x,y]=point(sample);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.strokeStyle='#45d6a1';ctx.beginPath();samples.slice(0,index+1).forEach((sample,i)=>{const [x,y]=point(sample);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();const [x,y]=point(samples[index]);ctx.fillStyle='#35a9ff';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}
  function tick(time){if(!playing)return;if(time-lastFrame>50){index=(index+1)%samples.length;lastFrame=time;render()}frame=requestAnimationFrame(tick)}
  byId('play').addEventListener('click',()=>{playing=!playing;byId('play').textContent=playing?'Pause replay':'Play replay';if(playing)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame)});byId('position').addEventListener('input',event=>{index=Number(event.target.value);render()});addEventListener('resize',draw,{passive:true});
  (async()=>{try{const response=await fetch(`/api/runs/${encodeURIComponent(runId)}/replay`),payload=await response.json();if(!response.ok)throw new Error(payload.detail||'Replay is unavailable');samples=payload.samples;if(!samples.length)throw new Error('Replay has no matched GPS and telemetry samples.');byId('title').textContent=`${payload.run.label} replay`;byId('backLink').href=`/runs/${encodeURIComponent(runId)}`;byId('position').max=String(samples.length-1);byId('player').hidden=false;render()}catch(error){const alert=utsm.node('div','alert error');alert.append(utsm.node('p','',error.message));if(error.message.includes('Unlock')){const link=utsm.node('a','button','Unlock on Import');link.href='/import?unlock=1';alert.append(link)}byId('message').replaceChildren(alert);byId('title').textContent='Replay unavailable'}})();
</script></body></html>
