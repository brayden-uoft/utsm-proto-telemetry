<!doctype html><html lang="en" data-mode="simple"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Runs | UTSM</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css?v=4"></head>
<body data-page="runs"><main><section class="page-head"><div><p class="eyebrow">Past runs</p><h1>Compare runs</h1><p class="lede">Put two saved runs side by side using the same summary measurements.</p></div></section><div id="message" role="status" aria-live="polite"></div>
  <section class="toolbar"><div class="field grow"><label for="firstRun">First run</label><select id="firstRun"></select></div><div class="field grow"><label for="secondRun">Second run</label><select id="secondRun"><option value="">Choose another run</option></select></div><button id="compareButton" class="button" type="button">Compare selected runs</button></section>
  <section id="results" class="section" hidden><div class="table-frame"><table><caption>Selected run comparison</caption><thead><tr><th scope="col">Measurement</th><th id="firstLabel" scope="col"></th><th id="secondLabel" scope="col"></th></tr></thead><tbody id="comparisonRows"></tbody></table></div><p class="visual-summary">A blank value means that column was not recorded in that run.</p></section>
</main><script src="/static/shell.js?v=2"></script><script>
  const byId=id=>document.getElementById(id),first=byId('firstRun'),second=byId('secondRun'),params=new URLSearchParams(location.search),initial=params.get('run')||'';
  function option(run){const item=document.createElement('option');item.value=run.id;item.textContent=`${run.label} · ${run.source}`;return item}
  function fmt(value,digits=2,suffix=''){return value==null?'Not available':`${Number(value).toFixed(digits)}${suffix}`}
  async function loadCatalog(){try{const response=await fetch('/api/runs'),runs=(await response.json()).runs.filter(run=>run.actions?.compare?.available);first.replaceChildren();second.replaceChildren();runs.forEach(run=>{const a=option(run),b=option(run);first.append(a);second.append(b)});const blank=document.createElement('option');blank.value='';blank.textContent='Choose another run';second.prepend(blank);if(initial&&runs.some(run=>run.id===initial))first.value=initial;if(runs.length>1&&!second.value)second.value=runs.find(run=>run.id!==first.value)?.id||''}catch(error){byId('message').replaceChildren(utsm.node('div','alert error','Run choices could not be loaded.'))}}
  async function compare(){const ids=[first.value,second.value].filter(Boolean);if(!ids.length){byId('message').replaceChildren(utsm.node('div','alert error','Choose at least one run.'));return}try{const query=new URLSearchParams();ids.forEach(id=>query.append('run',id));const response=await fetch(`/api/compare?${query}`),payload=await response.json();if(!response.ok)throw new Error(payload.detail||'Comparison failed');const runs=payload.runs;byId('firstLabel').textContent=runs[0].label;byId('secondLabel').textContent=runs[1]?.label||'No second run';const fields=[['Date','date',value=>value?utsm.formatDate(value):'Not set'],['Source','source',String],['Laps','laps',value=>value??'Not set'],['Distance','distance_m',value=>fmt(value,0,' m')],['CSV rows','rows',value=>Number(value).toLocaleString()],['Average speed','average_speed_kph',value=>fmt(value,2,' km/h')],['Peak speed','peak_speed_kph',value=>fmt(value,2,' km/h')],['Average current','average_current_A',value=>fmt(value,2,' A')],['Peak current','peak_current_A',value=>fmt(value,2,' A')],['Average power','average_power_W',value=>fmt(value,2,' W')],['Peak power','peak_power_W',value=>fmt(value,2,' W')]];const body=byId('comparisonRows');body.replaceChildren();fields.forEach(([label,key,format])=>{const row=document.createElement('tr'),heading=document.createElement('th');heading.scope='row';heading.textContent=label;row.append(heading);[runs[0],runs[1]].forEach(run=>{const cell=document.createElement('td');cell.textContent=run?format(run[key]):'Not selected';row.append(cell)});body.append(row)});byId('results').hidden=false;byId('message').textContent='Comparison ready.';history.replaceState(null,'',`/compare?${query}`)}catch(error){const alert=utsm.node('div','alert error');alert.append(utsm.node('p','',error.message));if(error.message.includes('Unlock')){const link=utsm.node('a','button','Unlock on Import');link.href='/import?unlock=1';alert.append(link)}byId('message').replaceChildren(alert);byId('results').hidden=true}}
  byId('compareButton').addEventListener('click',compare);loadCatalog().then(()=>{if(initial)compare()});
</script></body></html>
