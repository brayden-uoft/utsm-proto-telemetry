<!doctype html>
<html lang="en" data-mode="simple">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run | UTSM</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css?v=4"></head>
<body data-page="runs">
  <main>
    <section class="page-head"><div><p class="eyebrow">Past run</p><h1 id="runTitle">Loading run…</h1><p id="runSummary" class="lede"></p></div><div id="runActions" class="button-row"></div></section>
    <div id="runMessage" role="status" aria-live="polite"></div>
    <section id="overview" class="grid grid-4" aria-label="Run summary"></section>
    <section class="section"><div class="section-head"><h2>Run actions</h2><span class="muted">Only available actions are clickable</span></div><div id="capabilityGrid" class="capability-grid"></div></section>
    <section id="routeSection" class="section" hidden><div class="section-head"><h2>Route</h2><span id="gpsCount" class="muted"></span></div><canvas id="routeMap" class="map" aria-label="Run GPS route" aria-describedby="routeSummary"></canvas><p id="routeSummary" class="visual-summary"></p></section>
    <section id="chartSection" class="card section" hidden><div class="section-head"><div><h2>Quick chart</h2><p class="muted small">Numeric columns from the current table page.</p></div></div><canvas id="dataChart" class="chart" aria-label="CSV data chart" aria-describedby="chartSummary"></canvas><div id="chartLegend" class="button-row"></div><p id="chartSummary" class="visual-summary"></p></section>
    <section id="dataSection" class="section">
      <div class="section-head"><div><h2>Raw CSV viewer</h2><p class="muted small">Original uploads are never changed. Search and sorting only change this view.</p></div></div>
      <div class="toolbar"><div class="field grow"><label for="csvFile">CSV source</label><select id="csvFile"></select></div><div class="field grow"><label for="rowSearch">Search rows</label><div class="search-wrap"><input id="rowSearch" type="search" placeholder="Search every value"><button id="clearRows" class="search-clear" type="button">Clear</button></div></div><div class="field"><label for="pageSize">Rows per page</label><select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></div></div>
      <details class="card section"><summary><strong>Choose columns</strong></summary><div id="columnChoices" class="button-row section"></div></details>
      <div id="tableStatus" class="muted small section" role="status" aria-live="polite">Loading CSV…</div>
      <div class="table-frame"><table><caption id="tableCaption">Run data</caption><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
      <div class="pager"><span id="pageCount" class="muted"></span><div class="pager-actions"><button id="previousPage" class="button ghost" type="button">Previous</button><button id="nextPage" class="button ghost" type="button">Next</button></div></div>
    </section>
    <section class="section" data-advanced><div class="section-head"><h2>Files and import details</h2></div><div class="split"><div id="fileCards" class="run-list"></div><div id="metadata" class="card"></div></div></section>
  </main>
  <script src="/static/shell.js?v=2"></script>
  <script>
    const byId=id=>document.getElementById(id),runId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()),csvSelect=byId('csvFile'),rowSearch=byId('rowSearch'),pageSize=byId('pageSize'),head=byId('tableHead'),tableBody=byId('tableBody');let run=null,currentPage=null,offset=0,sortColumn=null,sortDirection='asc',searchTimer,hiddenColumns=new Set(),columnSignature='';
    function metric(label,value){const box=utsm.node('article','card metric');box.append(utsm.node('div','metric-label',label),utsm.node('div','metric-value',value));return box}
    function linkButton(label,href,kind='button'){const link=utsm.node('a',kind,label);link.href=href;return link}
    function fileUrl(file){return `/api/runs/${encodeURIComponent(run.id)}/files/${file.path.split('/').map(encodeURIComponent).join('/')}`}
    function kindLabel(file){return file.data_kind==='original'?'Original upload':file.data_kind==='canonical'?(file.type==='GPX'?'Imported route':'Imported telemetry'):file.data_kind==='packaged'?'Packaged data':'Metadata'}
    function renderCapabilities(){const grid=byId('capabilityGrid');grid.replaceChildren();const definitions=[['data','Data','Open the paginated CSV table.'],['charts','Charts','Plot numeric columns from the table.'],['replay','Replay','Animate telemetry around the GPS route.'],['strategy','Strategy','Open the associated strategy with its provenance.'],['compare','Compare','Compare this run with another saved run.']];definitions.forEach(([key,title,description])=>{const state=run.actions[key]||{available:false,reason:'Unavailable for this run.'},card=utsm.node('article',`card capability${state.available?'':' unavailable'}`);card.append(utsm.node('h3','',title),utsm.node('p','',state.available?description:state.reason));if(state.available&&state.href){const action=linkButton(`Open ${title.toLowerCase()}`,state.href,'button secondary');if(state.href.startsWith('#')||state.href.includes('#'))action.addEventListener('click',()=>{const fragment=state.href.split('#')[1];if(fragment&&byId(fragment))byId(fragment).scrollIntoView({behavior:'smooth'})});card.append(action)}grid.append(card)})}
    function renderRun(){document.title=`${run.label} | UTSM`;byId('runTitle').textContent=run.label;byId('runSummary').textContent=`${run.source} · ${run.source_detail}`;byId('overview').replaceChildren(metric('Date',run.date?utsm.formatDate(run.date):'Not set'),metric('Laps',String(run.laps??'Not set')),metric('Distance',utsm.formatDistance(run.distance_m)),metric('Data state',run.status));renderCapabilities();const actions=byId('runActions');actions.replaceChildren();if(run.capabilities.view_map){const map=linkButton('View route','#routeSection','button secondary');map.addEventListener('click',()=>byId('routeSection').scrollIntoView({behavior:'smooth'}));actions.append(map)}const originals=run.files.filter(file=>file.data_kind==='original');if(originals.length)actions.append(linkButton('Download original',fileUrl(originals[0]),'button secondary'));
      csvSelect.replaceChildren();run.files.filter(file=>file.viewable).forEach(file=>{const option=document.createElement('option');option.value=file.path;option.textContent=`${kindLabel(file)}: ${file.display_name||file.name}`;if(file.path===run.primary_csv)option.selected=true;csvSelect.append(option)});if(!csvSelect.options.length){byId('dataSection').hidden=true;clearChart()}else loadCsv();
      const cards=byId('fileCards');cards.replaceChildren();run.files.forEach(file=>{const card=utsm.node('article','card');card.append(utsm.node('span','badge',kindLabel(file)),utsm.node('h3','',file.display_name||file.name),utsm.node('p','muted small',utsm.formatBytes(file.size_bytes)),linkButton('Download',fileUrl(file),'button ghost'));cards.append(card)});const meta=byId('metadata');meta.replaceChildren(utsm.node('h2','', 'Import record'));[['Run ID',run.id],['Source',run.source],['Imported',run.imported_at?new Date(run.imported_at).toLocaleString():'Packaged with dashboard'],['GPS points',run.gps_points??'None'],['CSV files',run.csv_count]].forEach(([label,value])=>meta.append(utsm.node('div','label',label),utsm.node('p','',String(value))));if(run.warnings.length){const warning=utsm.node('div','alert warning');warning.textContent=run.warnings.join(' ');byId('runMessage').replaceChildren(warning)}if(run.has_gps)loadRoute()}
    async function loadRun(){try{const response=await fetch(`/api/runs/${encodeURIComponent(runId)}`),payload=await response.json();if(!response.ok){if(response.status===401)throw new Error('This uploaded run is locked. Open Import and unlock operator access, then return here.');throw new Error(response.status===404?'Run not found':payload.detail||'Run could not be loaded')}run=payload.run;renderRun()}catch(error){const alert=utsm.node('div','alert error');alert.append(utsm.node('p','',error.message));if(error.message.includes('locked'))alert.append(linkButton('Unlock on Import','/import?unlock=1','button'));byId('runMessage').replaceChildren(alert);byId('runTitle').textContent='Run unavailable';byId('dataSection').hidden=true;byId('capabilityGrid').replaceChildren()}}
    async function loadRoute(){try{const response=await fetch(`/api/runs/${encodeURIComponent(run.id)}/gpx`),payload=await response.json();if(!response.ok)throw new Error();byId('routeSection').hidden=false;byId('gpsCount').textContent=`${payload.total_points.toLocaleString()} GPS points`;drawRoute(payload.points);byId('routeSummary').textContent=`Route preview uses ${payload.points.length.toLocaleString()} plotted points from ${payload.total_points.toLocaleString()} recorded GPS points. The blue marker is the start.`;addEventListener('resize',()=>drawRoute(payload.points),{passive:true})}catch(error){byId('routeSummary').textContent='Route preview is unavailable.'}}
    function drawRoute(points){if(!points.length)return;const canvas=byId('routeMap'),ratio=devicePixelRatio||1,width=canvas.clientWidth,height=canvas.clientHeight;canvas.width=width*ratio;canvas.height=height*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle='#091522';ctx.fillRect(0,0,width,height);let minLat=Infinity,maxLat=-Infinity,minLon=Infinity,maxLon=-Infinity;points.forEach(([lat,lon])=>{minLat=Math.min(minLat,lat);maxLat=Math.max(maxLat,lat);minLon=Math.min(minLon,lon);maxLon=Math.max(maxLon,lon)});const pad=28,spanX=Math.max(maxLon-minLon,1e-9),spanY=Math.max(maxLat-minLat,1e-9),scale=Math.min((width-pad*2)/spanX,(height-pad*2)/spanY);ctx.strokeStyle='#45d6a1';ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();points.forEach(([lat,lon],index)=>{const x=width/2+(lon-(minLon+maxLon)/2)*scale,y=height/2-(lat-(minLat+maxLat)/2)*scale;index?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();const first=points[0],x=width/2+(first[1]-(minLon+maxLon)/2)*scale,y=height/2-(first[0]-(minLat+maxLat)/2)*scale;ctx.fillStyle='#35a9ff';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill()}
    async function loadCsv(){if(!csvSelect.value)return;const limit=Number(pageSize.value),params=new URLSearchParams({file:csvSelect.value,offset:String(offset),limit:String(limit),q:rowSearch.value.trim(),direction:sortDirection});if(sortColumn)params.set('sort',sortColumn);byId('tableStatus').textContent='Loading rows…';try{const response=await fetch(`/api/runs/${encodeURIComponent(run.id)}/csv?${params}`),payload=await response.json();if(!response.ok)throw new Error(payload.detail||'CSV could not be loaded');currentPage=payload;renderTable();drawChart()}catch(error){currentPage=null;byId('tableStatus').textContent=error.message;head.replaceChildren();tableBody.replaceChildren();byId('tableCaption').textContent='CSV data unavailable.';byId('pageCount').textContent='';clearChart()}}
    function ensureColumnChoices(){const signature=currentPage.columns.join('\u0000');if(signature===columnSignature)return;columnSignature=signature;const choices=byId('columnChoices');choices.replaceChildren();currentPage.columns.forEach(column=>{const label=utsm.node('label','button ghost'),input=document.createElement('input');input.type='checkbox';input.checked=!hiddenColumns.has(column);input.style.width='auto';input.style.minHeight='0';input.addEventListener('change',()=>{input.checked?hiddenColumns.delete(column):hiddenColumns.add(column);renderTableRows();drawChart()});label.append(input,document.createTextNode(` ${column}`));choices.append(label)})}
    function renderTable(){if(!currentPage)return;ensureColumnChoices();renderTableRows()}
    function renderTableRows(){head.replaceChildren();tableBody.replaceChildren();currentPage.columns.forEach(column=>{if(hiddenColumns.has(column))return;const th=document.createElement('th');th.scope='col';if(sortColumn===column)th.setAttribute('aria-sort',sortDirection==='asc'?'ascending':'descending');const button=utsm.node('button','',column+(sortColumn===column?(sortDirection==='asc'?' ↑':' ↓'):''));button.type='button';button.addEventListener('click',()=>{if(sortColumn===column)sortDirection=sortDirection==='asc'?'desc':'asc';else{sortColumn=column;sortDirection='asc'}offset=0;loadCsv()});th.append(button);head.append(th)});currentPage.rows.forEach(row=>{const tr=document.createElement('tr');currentPage.columns.forEach(column=>{if(hiddenColumns.has(column))return;const td=document.createElement('td');td.textContent=row[column];tr.append(td)});tableBody.append(tr)});const start=currentPage.total?currentPage.offset+1:0,end=Math.min(currentPage.offset+currentPage.limit,currentPage.total),source=csvSelect.options[csvSelect.selectedIndex]?.textContent||'CSV';byId('tableCaption').textContent=`${source}. Rows ${start} to ${end} of ${currentPage.total}.`;byId('tableStatus').textContent=currentPage.truncated?'Search is limited to the first 200,000 rows for safety.':'CSV loaded.';byId('pageCount').textContent=`Rows ${start}–${end} of ${currentPage.total}`;byId('previousPage').disabled=currentPage.offset===0;byId('nextPage').disabled=end>=currentPage.total}
    function clearChart(){const canvas=byId('dataChart'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);byId('chartLegend').replaceChildren();byId('chartSummary').textContent='No chart data is available.';byId('chartSection').hidden=true}
    function drawChart(){if(!currentPage?.rows.length){clearChart();return}const columns=currentPage.columns.filter(column=>!hiddenColumns.has(column)&&currentPage.rows.some(row=>row[column]!==''&&!Number.isNaN(Number(row[column])))).slice(0,3);if(!columns.length){clearChart();return}const section=byId('chartSection');section.hidden=false;const canvas=byId('dataChart'),ratio=devicePixelRatio||1,width=canvas.clientWidth,height=canvas.clientHeight;canvas.width=width*ratio;canvas.height=height*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,width,height);ctx.strokeStyle='#263a55';ctx.beginPath();for(let i=0;i<5;i++){const y=20+i*(height-40)/4;ctx.moveTo(42,y);ctx.lineTo(width-14,y)}ctx.stroke();const colors=['#35a9ff','#45d6a1','#ffb24b'],summaries=[];columns.forEach((column,index)=>{const values=currentPage.rows.map(row=>Number(row[column])).filter(Number.isFinite),min=Math.min(...values),max=Math.max(...values),span=max-min||1;ctx.strokeStyle=colors[index];ctx.lineWidth=2;ctx.beginPath();currentPage.rows.forEach((row,rowIndex)=>{const value=Number(row[column]);if(!Number.isFinite(value))return;const x=42+rowIndex/Math.max(currentPage.rows.length-1,1)*(width-58),y=height-20-(value-min)/span*(height-40);rowIndex?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();summaries.push(`${column} ranges from ${min.toFixed(2)} to ${max.toFixed(2)}`)});const legend=byId('chartLegend');legend.replaceChildren();columns.forEach((column,index)=>{const item=utsm.node('span','badge',column);item.style.color=colors[index];legend.append(item)});byId('chartSummary').textContent=`${currentPage.rows.length} rows plotted. ${summaries.join('. ')}.`}
    csvSelect.addEventListener('change',()=>{offset=0;sortColumn=null;hiddenColumns.clear();columnSignature='';loadCsv()});pageSize.addEventListener('change',()=>{offset=0;loadCsv()});rowSearch.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{offset=0;loadCsv()},250)});byId('clearRows').addEventListener('click',()=>{rowSearch.value='';offset=0;rowSearch.focus();loadCsv()});byId('previousPage').addEventListener('click',()=>{offset=Math.max(0,offset-Number(pageSize.value));loadCsv()});byId('nextPage').addEventListener('click',()=>{offset+=Number(pageSize.value);loadCsv()});addEventListener('resize',()=>{if(currentPage)drawChart()},{passive:true});loadRun();
  </script>
</body></html>
