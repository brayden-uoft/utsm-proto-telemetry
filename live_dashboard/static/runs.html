<!doctype html>
<html lang="en" data-mode="simple">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run Library | UTSM</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css?v=4"></head>
<body data-page="runs">
  <main>
    <section class="page-head"><div><p class="eyebrow">Saved data</p><h1>Run library</h1><p class="lede">Open every packaged or imported run from one place.</p></div><div class="button-row"><a class="button secondary" href="/strategy">Strategy library</a><a class="button" href="/import">Import a run</a></div></section>
    <section class="toolbar" aria-label="Filter runs"><div class="field grow"><label for="runSearch">Search runs</label><div class="search-wrap"><input id="runSearch" type="search" placeholder="Search by name, date, source, or state" autocomplete="off"><button id="clearSearch" class="search-clear" type="button">Clear</button></div></div><p id="resultCount" class="muted" role="status" aria-live="polite">Loading runs…</p></section>
    <section id="runList" class="run-list section" aria-label="Saved runs"></section>
  </main>
  <script src="/static/shell.js?v=2"></script>
  <script>
    const input=document.getElementById('runSearch'),clear=document.getElementById('clearSearch'),list=document.getElementById('runList'),count=document.getElementById('resultCount');let timer;
    function stat(label,value,optional=false){const box=utsm.node('div',`run-stat${optional?' optional-stat':''}`);box.append(utsm.node('span','muted small',label),utsm.node('strong','',value));return box}
    function catalogAction(run,key,label){const state=run.actions?.[key]||{available:false,reason:'Unavailable for this run.'},item=utsm.node('div',`catalog-action${state.available?'':' unavailable'}`);if(state.available&&state.href){const link=utsm.node('a','button secondary',label);link.href=state.href;item.append(link)}else{item.append(utsm.node('span','catalog-action-label',`${label} unavailable`),utsm.node('small','muted',state.reason||'Unavailable for this run.'))}return item}
    function render(payload){const runs=payload.runs||[],locked=Number(payload.locked_uploaded_count||0);list.replaceChildren();count.textContent=`${runs.length} visible run${runs.length===1?'':'s'}${locked?` · ${locked} uploaded run${locked===1?'':'s'} locked`:''}`;if(locked){const lockedCard=utsm.node('article','card locked-summary');lockedCard.append(utsm.node('h2','',`${locked} uploaded run${locked===1?' is':'s are'} locked`),utsm.node('p','muted','Unlock operator access to browse uploaded or SD card data.'));const unlock=utsm.node('a','button','Unlock on Import');unlock.href='/import?unlock=1';lockedCard.append(unlock);list.append(lockedCard)}if(!runs.length){const empty=utsm.node('div','empty');empty.append(utsm.node('h2','',input.value?'No matching visible runs':locked?'No packaged runs available':'No runs saved yet'),utsm.node('p','',input.value?'Clear the search or try another term.':locked?'Unlock operator access to browse uploaded runs.':'Import CSV, ZIP, or GPX data to get started.'));if(!input.value&&!locked){const action=utsm.node('a','button','Import a run');action.href='/import';empty.append(action)}list.append(empty);return}
      runs.forEach(run=>{const card=utsm.node('article','card run-card'),identity=utsm.node('div'),badges=utsm.node('div','button-row');badges.append(utsm.node('span',`badge ${run.analysis_ready?'ready':'raw'}`,run.status),utsm.node('span','badge',run.source));identity.append(badges,utsm.node('h2','',run.label),utsm.node('p','muted small',run.source_detail));const actions=utsm.node('div','catalog-actions');[['data','Data'],['charts','Charts'],['replay','Replay'],['strategy','Strategy'],['compare','Compare']].forEach(([key,label])=>actions.append(catalogAction(run,key,label)));card.append(identity,stat('Date',run.date?utsm.formatDate(run.date):'Not set'),stat('Laps',run.laps??'Not set'),stat('Distance',utsm.formatDistance(run.distance_m),true),actions);list.append(card)});
    }
    async function load(){try{const response=await fetch(`/api/runs?q=${encodeURIComponent(input.value.trim())}`);if(!response.ok)throw new Error();render(await response.json())}catch(error){list.replaceChildren(utsm.node('div','alert error','Runs could not be loaded. Check the dashboard and try again.'));count.textContent='Run list unavailable'}}
    input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,180)});clear.addEventListener('click',()=>{input.value='';input.focus();load()});load();
  </script>
</body></html>
